[game]
name = "Poke and Mon"
slug = "beastling"
version = "1.2.0"
author = "lazi"
description = """
Catch, raise and battle creatures in the Hollow Vale -- or skip the
catching and draft on The Circuit.

Story Mode: twenty species across six types, levelling and evolution,
lures and a field journal, six routes and five champions who keep
the roads. Status ailments, stat swings, priority moves and crits
give the fights real teeth.

The Circuit: a separate trainer profile, no catching required. Draft
a squad from every known species -- Free mode picks freely, Ranked
mode drafts under a points budget so a team has to be built, not just
stacked -- then run a generated bracket with no healing between
rounds and climb the rank tiers."""
tags = ["rpg", "creatures", "turn-based"]
entry = ["{python}", "main.py"]
min_cols = 66
min_rows = 24


[[awards]]
key = "first-catch"
title = "Something Followed You Home"
description = "Caught your first beast"

[[awards]]
key = "half-journal"
title = "Half the Journal"
description = "Caught half of everything in the Vale"

[[awards]]
key = "first-badge"
title = "First Badge"
description = "Beat a champion of the roads"

[[awards]]
key = "all-badges"
title = "Keeper of the Roads"
description = "Beat every champion in the Hollow Vale"

[[awards]]
key = "circuit-contender"
title = "Circuit Contender"
description = "Reached round 4 of a Circuit run"

[[awards]]
key = "circuit-champion"
title = "Circuit Champion"
description = "Won a full Circuit run"
