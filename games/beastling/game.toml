[game]
name = "Beastling"
slug = "beastling"
version = "1.0.0"
author = "lazi"
description = """
Catch, raise and battle creatures in the Hollow Vale.

Twenty species across six types, levelling and evolution,
lures and a field journal, six routes and five champions
who keep the roads."""
tags = ["rpg", "creatures", "turn-based"]
entry = ["{python}", "main.py"]
min_cols = 66
min_rows = 20


[[awards]]
key = "first-catch"
title = "Something Followed You Home"
description = "Caught your first beast"

[[awards]]
key = "half-journal"
title = "Half the Journal"
description = "Caught half of everything in the Vale"

[[awards]]
key = "first-badge"
title = "First Badge"
description = "Beat a champion of the roads"

[[awards]]
key = "all-badges"
title = "Keeper of the Roads"
description = "Beat every champion in the Hollow Vale"
