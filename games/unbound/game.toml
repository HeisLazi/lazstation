[game]
name = "Unbound"
slug = "unbound"
version = "0.1.0"
author = "lazi"
description = """
You are property before you're anyone the crowd knows.

Telegraphed grid combat, a body with four places to get hurt, and
a wound that doesn't care whether you won. Read the strike coming,
block it, dodge it, or close in and cancel it before it lands --
every choice costs something, and it outlives the fight."""
tags = ["combat", "roguelike", "curses", "wip"]
entry = ["{python}", "main.py"]
min_cols = 70
min_rows = 20
