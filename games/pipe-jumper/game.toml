[game]
name = "Pipe Jumper"
slug = "pipe-jumper"
version = "1.0.0"
author = "lazi"
description = """
A real-time side-scrolling platformer. Run, jump, stomp, collect coins.

Proof that the terminal can do action games: 30 frames a second,
variable jump height, moving enemies and a scrolling world."""
tags = ["platformer", "action", "real-time"]
entry = ["{python}", "main.py"]
min_cols = 70
min_rows = 20
